{% extends "base.html" %}
{% block title %}Create account - {{ app_name }}{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p class="muted">Free for one technician.</p>
<form method="post" class="card">
  {{ csrf() }}
  <div class="field"><label for="business">Your IT business name</label><input type="text" id="business" name="business" required autofocus></div>
  <div class="field"><label for="name">Your name</label><input type="text" id="name" name="name" required></div>
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
  <div class="field"><label for="password">Password (8 characters or more)</label><input type="password" id="password" name="password" minlength="8" required></div>
  <button class="btn">Create account</button>
</form>
<p class="small">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
