# Email and WhatsApp settings.
#
# Copy this file to  data/channels.ini  and fill in the parts you want.
# A section left empty simply stays switched off. Changes apply straight away
# for sending; restart the app after first turning on [email_in].
#
# data/channels.ini holds passwords. Never share it or put it in version control.

[app]
# The address people use to reach this app from outside, with no slash at the
# end. Used for the links in emails and WhatsApp messages.
public_url =

[email_out]
# For sending. These are your mail provider's SMTP details.
# Gmail and Microsoft 365 need an "app password", not your normal password.
host =
port = 587
username =
password =
# What staff see as the sender, for example: IT Help <help@yourbusiness.com>
from_address =

[email_in]
# For receiving. A mailbox used only for helpdesk requests, read over IMAP.
# Every unread email in it is treated as a request and marked as read.
host =
port = 993
username =
password =
folder = INBOX

[whatsapp]
# From developers.facebook.com: your app > WhatsApp > API Setup.
phone_number_id =
# A permanent token from a System User (the temporary one expires in 24 hours).
access_token =
# Your app > App settings > Basic > App secret.
app_secret =
# Any phrase you make up. Type the same phrase into Meta's webhook form.
verify_token =
api_version = v24.0

[paystack]
# For customers paying for the Team plan (M-Pesa and cards).
# From dashboard.paystack.com: Settings > API Keys & Webhooks. Starts with sk_live_
# (or sk_test_ while testing). Also on that page, set the Webhook URL to
# <public_url>/webhooks/paystack
secret_key =
